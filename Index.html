<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Sharing Web App</title>
    <style>
      :root {
        --bg: #eef5ff;
        --surface: #ffffff;
        --primary: #3b82f6;
        --primary-dark: #1d4ed8;
        --text: #0f172a;
        --muted: #475569;
        --border: rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 35%),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        color: var(--text);
      }

      .page {
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .card {
        width: min(760px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
        padding: 36px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.03em;
      }

      p.lead {
        margin: 0 0 28px;
        color: var(--muted);
        line-height: 1.65;
      }

      .upload-form {
        display: grid;
        gap: 16px;
        margin-bottom: 28px;
      }

      .upload-form input[type="file"] {
        padding: 14px 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #f8fafc;
        cursor: pointer;
      }

      .upload-form button {
        width: fit-content;
        padding: 14px 24px;
        border: none;
        border-radius: 14px;
        background: var(--primary);
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 170ms ease;
      }

      .upload-form button:hover {
        background: var(--primary-dark);
      }

      .status {
        min-height: 22px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .dashboard-link {
        margin-top: 8px;
      }

      .dashboard-link a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 14px;
        background: rgba(59, 130, 246, 0.12);
        color: var(--primary-dark);
        text-decoration: none;
        font-weight: 600;
      }

      .dashboard-link a:hover {
        background: rgba(59, 130, 246, 0.18);
      }

      .file-list {
        display: grid;
        gap: 12px;
      }

      .file-item {
        padding: 18px 20px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #f8fbff;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .file-item a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      .file-item a:hover {
        text-decoration: underline;
      }

      .empty-state {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>File Sharing Web App</h1>
        <p class="lead">Upload a file and get a download link instantly. Your files are stored locally in the server's <code>uploads/</code> folder.</p>

        <form id="file-form" class="upload-form">
          <input type="file" id="file-input" accept="*/*" />
          <button type="submit">Upload File</button>
          <div class="status" id="status-text"></div>
          <div class="dashboard-link">
            <a href="http://localhost:8501" target="_blank" rel="noopener noreferrer">
              Open the Streamlit Spreadsheet Dashboard
            </a>
          </div>
        </form>

        <div>
          <h2>Uploaded files</h2>
          <div id="file-list" class="file-list empty-state">No files uploaded yet.</div>
        </div>
      </section>
    </main>

    <script>
      const fileForm = document.getElementById("file-form");
      const fileInput = document.getElementById("file-input");
      const fileList = document.getElementById("file-list");
      const statusText = document.getElementById("status-text");

      const renderFiles = (files) => {
        if (!files || files.length === 0) {
          fileList.innerHTML = "No files uploaded yet.";
          fileList.classList.add("empty-state");
          return;
        }

        fileList.classList.remove("empty-state");
        fileList.innerHTML = "";

        files.forEach((file) => {
          const item = document.createElement("div");
          item.className = "file-item";

          const link = document.createElement("a");
          link.href = `/download/${file.id}`;
          link.textContent = file.name;
          link.target = "_blank";

          item.appendChild(link);
          fileList.appendChild(item);
        });
      };

      fileForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!fileInput.files || fileInput.files.length === 0) {
          statusText.textContent = "Please choose a file before uploading.";
          return;
        }

        statusText.textContent = "Uploading...";
        fileForm.querySelector("button").disabled = true;

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            const data = await response.json().catch(() => null);
            const message = data?.error || "Upload failed. Please try again.";
            statusText.textContent = message;
            return;
          }

          const files = await response.json();
          renderFiles(files);
          statusText.textContent = "Upload successful!";
          fileInput.value = "";
        } catch (error) {
          statusText.textContent = "Unable to upload file. Check the server and try again.";
        } finally {
          fileForm.querySelector("button").disabled = false;
        }
      });
    </script>
  </body>
</html>
